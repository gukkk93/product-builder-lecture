<style>

  :root {
    --bg-start: #ffe4ec;
    --bg-end: #f3e6ff;
    --accent: #b5546f;
    --card-bg: rgba(255,255,255,0.75);

    --subtitle-color: #8a6b7a;
    --select-bg: #fff9fa;
    --select-border: #eec9d3;
    --result-title-color: #c2185b;
    --result-text-color: #5a3f47;

    --button-bg-hover: #ff4d6d;
    --button-text: #ffffff;
    --toggle-bg: rgba(255,255,255,0.7);

  html[data-theme="dark"] {
    --bg-start: #241726;
    --bg-end: #180f22;
    --accent: #d99cb3;
    --card-bg: rgba(40, 26, 46, 0.75);

    --button-bg-hover: #ff4d6d;
    --button-text: #ffffff;
    --toggle-bg: rgba(255,255,255,0.12);

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    text-align: center;
    position: relative;
    padding: 90px 16px 50px;
    transition: background 0.3s ease;
  }

  #theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 2;
    width: 44px;
    height: 44px;
    padding: 0;
    font-size: 20px;
    font-weight: normal;
    color: var(--toggle-text);
    background: var(--toggle-bg);
    border: none;
    border-radius: 50%;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: background 0.3s ease, transform 0.15s ease;
  }

  #theme-toggle:hover {
    transform: scale(1.08);
  }

  #partnership-link {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 2;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: bold;
    color: var(--toggle-text);
    background: var(--toggle-bg);
    border-radius: 20px;
    text-decoration: none;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    transition: background 0.3s ease, transform 0.15s ease;
  }

  #partnership-link:hover {
    transform: scale(1.05);
  }

  /* 떠다니는 배경 */
  #star-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .floating-star {
    position: absolute;
    bottom: -10%;
    font-size: 22px;
    opacity: 0.75;
    animation-name: floatUp;
    animation-timing-function: ease-in;
    will-change: transform, opacity;
  }

    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 0.9;
    }
    100% {
      transform: translateY(-115vh) translateX(var(--drift, 0px)) rotate(360deg);
      opacity: 0;
    }

  .content {

    z-index: 1;

    align-items: center;

    color: var(--subtitle-color);

    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 28px;

<script>
  // 다크모드 / 화이트모드
  const themeToggleBtn = document.getElementById('theme-toggle');

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('theme', theme);
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  }

  (function initTheme() {
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved || (prefersDark ? 'dark' : 'light'));
  })();

  // 생년월일 선택 드롭다운 구성
  const yearSelect = document.getElementById('year');
  const monthSelect = document.getElementById('month');
  const daySelect = document.getElementById('day');
  const resultCard = document.getElementById('result-card');
  const zodiacLine = document.getElementById('zodiac-line');
  const resultTitle = document.getElementById('result-title');
  const resultText = document.getElementById('result-text');

  const currentYear = new Date().getFullYear();

  function fillSelect(select, start, end, placeholder) {
    const placeholderOption = document.createElement('option');
    placeholderOption.value = '';
    placeholderOption.textContent = placeholder;
    placeholderOption.disabled = true;
    placeholderOption.selected = true;
    select.appendChild(placeholderOption);

    for (let v = start; v <= end; v++) {
      const option = document.createElement('option');
      option.value = v;
      option.textContent = v;
      select.appendChild(option);
    }
  }

  fillSelect(yearSelect, currentYear - 99, currentYear, '년');
  yearSelect.value = '';
  fillSelect(monthSelect, 1, 12, '월');
  fillSelect(daySelect, 1, 31, '일');

  function daysInMonth(year, month) {
    return new Date(year, month, 0).getDate();
  }

  function refreshDayOptions() {
    const year = parseInt(yearSelect.value, 10);
    const month = parseInt(monthSelect.value, 10);
    const maxDay = (year && month) ? daysInMonth(year, month) : 31;
    const currentDay = parseInt(daySelect.value, 10);

    daySelect.innerHTML = '';
    fillSelect(daySelect, 1, maxDay, '일');

    if (currentDay && currentDay <= maxDay) {
      daySelect.value = currentDay;
    }
  }

  yearSelect.addEventListener('change', refreshDayOptions);
  monthSelect.addEventListener('change', refreshDayOptions);

  // 간단한 문자열 해시 (같은 입력이면 항상 같은 결과)
  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    }
    return hash;
  }

  function pick(arr, seed) {
    return arr[seed % arr.length];
  }

  function getSelectedDate() {
    const year = parseInt(yearSelect.value, 10);
    const month = parseInt(monthSelect.value, 10);
    const day = parseInt(daySelect.value, 10);
    if (!year || !month || !day) return null;
    return { year, month, day };
  }

      "눈과 어깨 피로가 쌓이기 쉬우니 중간중간 휴식을 취해주세요.",
      "따뜻한 물 한 잔이 컨디션 관리에 도움이 되는 하루예요.",
      "감정 기복이 몸 컨디션에 영향을 줄 수 있으니 마음을 편하게 가지세요.",
      "무리한 일정보다는 페이스 조절이 필요한 하루입니다.",
      "가벼운 두통이나 피로감이 있을 수 있으니 충분한 휴식을 취하세요.",
      "몸이 보내는 신호에 조금 더 귀 기울이면 좋은 하루가 될 거예요."
    ]
  };

  function showResult(zodiacHtml, title, bodyHtml) {
    resultCard.classList.remove('hidden-card');
    resultCard.classList.add('fade');
    setTimeout(() => {
      zodiacLine.innerHTML = zodiacHtml;
      resultTitle.textContent = title;
      resultText.innerHTML = bodyHtml;
      resultCard.classList.remove('fade');
    }, 150);
  }

  function showSaju() {
    const date = getSelectedDate();
    if (!date) {
      showResult('', '생년월일을 선택해주세요', '년 / 월 / 일을 모두 선택한 뒤 다시 눌러주세요 🙏');
      return;
    }

    const zodiac = getZodiac(date.year);
    const seed = hashCode(`${date.year}-${date.month}-${date.day}`);
    const message = pick(sajuMessages, seed);

    showResult(
      `${zodiac.emoji} ${date.year}년생 · ${zodiac.name}띠`,
      '나의 사주',
      message
    );
  }

  function showToday() {
    const date = getSelectedDate();
    if (!date) {
      showResult('', '생년월일을 선택해주세요', '년 / 월 / 일을 모두 선택한 뒤 다시 눌러주세요 🙏');
      return;
    }

    const zodiac = getZodiac(date.year);
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
    const baseSeed = hashCode(`${date.year}-${date.month}-${date.day}-${todayStr}`);

    const categories = ['총운', '애정운', '금전운', '건강운'];
    let bodyHtml = '';
    categories.forEach((cat, i) => {
      const seed = baseSeed + i * 97;
      const line = pick(todayFortune[cat], seed);
      bodyHtml += `<div class="fortune-row"><span class="fortune-label">${cat}</span> ${line}</div>`;
    });

    showResult(
      `${zodiac.emoji} ${date.year}년생 · ${zodiac.name}띠 · ${today.getMonth() + 1}월 ${today.getDate()}일 운세`,
      '오늘의 운세',
      bodyHtml
    );
  }

  // 떠다니는 배경 (자동 생성)
  const starLayer = document.getElementById('star-layer');
  const starEmojis = ['🔮', '✨', '🌙', '⭐', '🌟'];

  function spawnStar() {
    const star = document.createElement('span');
    star.className = 'floating-star';
    star.textContent = starEmojis[Math.floor(Math.random() * starEmojis.length)];
    const left = Math.random() * 100;
    const drift = (Math.random() * 120 - 60) + 'px';
    const duration = 6 + Math.random() * 5;
    const size = 16 + Math.random() * 18;

    star.style.left = left + 'vw';
    star.style.fontSize = size + 'px';
    star.style.setProperty('--drift', drift);
    star.style.animationDuration = duration + 's';

    starLayer.appendChild(star);
    setTimeout(() => star.remove(), duration * 1000);
  }

  setInterval(spawnStar, 900);
  spawnStar();
</script>

</body>
</html>
