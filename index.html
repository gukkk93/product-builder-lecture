    <!-- og-banner.png is a fixed public/ URL, unlike the Vite-fingerprinted
         assets elsewhere in this app — platforms (KakaoTalk in particular)
         cache the image by this exact URL and can keep serving stale bytes
         indefinitely even after the file changes. Bump ?v=N here (and in
         the twitter:image tag below) every time scripts/generate-og-banner.mjs
         is re-run, so it's a genuinely new URL no cache has seen. -->
    <meta property="og:image" content="https://getohaeng.com/og-banner.png?v=2" />
