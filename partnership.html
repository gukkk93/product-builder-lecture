<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제휴 문의</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffdde1, #ffe6f0);
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding: 40px 16px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: 0 10px 30px rgba(214, 51, 108, 0.15);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 24px;
    color: #d6336c;
    text-align: center;
  }

  .subtitle {
    margin: 0 0 28px;
    font-size: 14px;
    color: #888;
    text-align: center;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #555;
    margin-bottom: 6px;
  }

  .field {
    margin-bottom: 18px;
  }

  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #eec9d3;
    border-radius: 10px;
    font-family: inherit;
    background: #fff9fa;
    transition: border-color 0.2s ease;
  }

  input[type="text"]:focus,
  input[type="email"]:focus,
  textarea:focus {
    outline: none;
    border-color: #ff6b81;
  }

  textarea {
    resize: vertical;
    min-height: 120px;
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    background: #ff6b81;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(255, 107, 129, 0.4);
    transition: transform 0.15s ease, background 0.2s ease;
  }

  button:hover {
    background: #ff4d6d;
    transform: scale(1.02);
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  #form-status {
    margin-top: 16px;
    font-size: 14px;
    text-align: center;
    min-height: 20px;
  }

  #form-status.success {
    color: #2b8a3e;
  }

  #form-status.error {
    color: #c92a2a;
  }

  /* 스팸 방지용 허니팟 필드 (사람 눈에는 보이지 않음) */
  .hp-field {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
</style>
</head>
<body>

<div class="card">
  <h1>제휴 문의</h1>
  <p class="subtitle">궁금하신 내용을 남겨주시면 빠르게 답변드리겠습니다.</p>

  <form id="partnership-form" action="https://formspree.io/f/mqpzeodg" method="POST">
    <input type="hidden" name="_subject" value="[제휴 문의] 새로운 문의가 도착했습니다">
    <div class="hp-field" aria-hidden="true">
      <label for="_gotcha">이 필드는 비워두세요</label>
      <input type="text" id="_gotcha" name="_gotcha" tabindex="-1" autocomplete="off">
    </div>

    <div class="field">
      <label for="name">이름 / 담당자명</label>
      <input type="text" id="name" name="name" required autocomplete="name">
    </div>

    <div class="field">
      <label for="company">회사 / 브랜드명</label>
      <input type="text" id="company" name="company" autocomplete="organization">
    </div>

    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>

    <div class="field">
      <label for="message">문의 내용</label>
      <textarea id="message" name="message" required placeholder="제휴 제안 내용을 자유롭게 작성해주세요."></textarea>
    </div>

    <button type="submit" id="submit-btn">문의 보내기</button>
    <div id="form-status" role="status" aria-live="polite"></div>
  </form>
</div>

<script>
  const form = document.getElementById('partnership-form');
  const statusEl = document.getElementById('form-status');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = '전송 중...';
    statusEl.textContent = '';
    statusEl.className = '';

    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        form.reset();
        statusEl.textContent = '문의가 정상적으로 접수되었습니다. 빠른 시일 내에 답변드리겠습니다.';
        statusEl.className = 'success';
      } else {
        const result = await response.json().catch(() => null);
        const errorMsg = result && result.errors
          ? result.errors.map(err => err.message).join(', ')
          : '오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
        statusEl.textContent = errorMsg;
        statusEl.className = 'error';
      }
    } catch (err) {
      statusEl.textContent = '네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
      statusEl.className = 'error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '문의 보내기';
    }
  });
</script>

</body>
</html>
